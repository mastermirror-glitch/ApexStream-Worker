name: SeekStreaming Season Ingest
on:
  workflow_dispatch:
    inputs:
      episodes_json: { required: true }   # JSON array of episode job objects
      seek_cookies:  { required: false, default: '' }
      streamhg_key:  { required: false, default: '' }
      upload_provider: { required: false, default: 'streamhg' }
      callback_url:  { required: true }
      base_title:    { required: false }
      year:          { required: false }
      quality:       { required: false }
      site_name:     { required: false, default: 'ApexStreaming.org' }
      folder_id:     { required: false, default: '' }
      hf_token:      { required: false, default: '' }
      hf_repo:       { required: false, default: '' }
      hf_backup_enabled: { required: false, default: 'false' }
      internal_token: { required: true }

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Print Job Summary
        env:
          EPISODES_JSON: ${{ github.event.inputs.episodes_json }}
        run: |
          echo "### SeekStreaming Season Ingest" | tee -a $GITHUB_STEP_SUMMARY
          echo "- **Title**: ${{ github.event.inputs.base_title }} (${{ github.event.inputs.year }})" | tee -a $GITHUB_STEP_SUMMARY
          echo "- **Quality**: ${{ github.event.inputs.quality }}" | tee -a $GITHUB_STEP_SUMMARY
          echo "- **Site Name**: ${{ github.event.inputs.site_name }}" | tee -a $GITHUB_STEP_SUMMARY
          COUNT=$(echo "$EPISODES_JSON" | jq 'length')
          echo "- **Episodes in Season**: $COUNT" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "#### Episode List" | tee -a $GITHUB_STEP_SUMMARY
          echo "$EPISODES_JSON" | jq -r 'def pad: tostring | if length == 1 then "0"+. else . end; .[] | "- **S\(.season_number | pad)E\(.episode_number | pad)**: \(.filename)"' | tee -a $GITHUB_STEP_SUMMARY || echo "Failed to parse episodes JSON" | tee -a $GITHUB_STEP_SUMMARY

      - name: Background Disk Cleanup
        run: |
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          echo "Cleanup running in background..."

      - uses: actions/checkout@v4

      - name: Setup Tools (Fast Static Binaries)
        run: |
          # 1. Ensure aria2 & ffmpeg are present (pre-installed on standard GitHub runners)
          command -v aria2c >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends aria2 || true
          command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ffmpeg || true

          # 2. Fallback for ffmpeg/ffprobe if not already in PATH
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "Installing static ffmpeg/ffprobe fallback..."
            wget -qO- https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C /tmp
            sudo mv /tmp/ffmpeg /tmp/ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          fi

          # 3. Install official verified yt-dlp & huggingface_hub via pip (PyPI CDN, ~3s runtime)
          sudo pip install --break-system-packages --ignore-installed --no-cache-dir yt-dlp huggingface_hub

          # 4. Verify all required tools
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          yt-dlp --version
          aria2c --version | head -n 1

      - name: Run Season Pipeline
        run: node scripts/ingest/season-orchestrator.cjs
        env:
          EPISODES_JSON:      "${{ github.event.inputs.episodes_json }}"
          SEEK_COOKIES:       "${{ github.event.inputs.seek_cookies || secrets.SEEK_COOKIES }}"
          CALLBACK_URL:       "${{ github.event.inputs.callback_url }}"
          BASE_TITLE:         "${{ github.event.inputs.base_title }}"
          YEAR:               "${{ github.event.inputs.year }}"
          QUALITY:            "${{ github.event.inputs.quality }}"
          SITE_NAME:          "${{ github.event.inputs.site_name }}"
          UPLOAD_PROVIDER:    "${{ github.event.inputs.upload_provider }}"
          STREAMHG_KEY:       "${{ github.event.inputs.streamhg_key || secrets.STREAMHG_KEY }}"
          SEEK_FOLDER_ID:     "${{ github.event.inputs.folder_id }}"
          HF_TOKEN:           "${{ github.event.inputs.hf_token || secrets.HF_TOKEN }}"
          HF_REPO:            "${{ github.event.inputs.hf_repo || secrets.HF_REPO }}"
          HF_BACKUP_ENABLED:  "${{ github.event.inputs.hf_backup_enabled }}"
          INTERNAL_TOKEN:     "${{ github.event.inputs.internal_token || secrets.INTERNAL_API_TOKEN || secrets.INTERNAL_TOKEN }}"
